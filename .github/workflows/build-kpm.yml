name: Build rtl8812au KPM

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-kpm.yml"
      - "kpm/**"
      - "patches/**"
      - "scripts/**"

permissions:
  contents: read

env:
  KP_REPO: https://github.com/bmax121/KernelPatch.git
  KP_REF: main

  RTL_REPO: https://github.com/Amazeble/rtl8812au.git
  RTL_REF: v5.2.20

  TOOLCHAIN_VERSION: 14.2.rel1
  TARGET_COMPILE: aarch64-none-elf-

jobs:
  build:
    name: Build RTL8812AU KPM
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # Checkout this repository
      # ------------------------------------------------------------

      - name: Checkout KPM project
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Host dependencies
      # ------------------------------------------------------------

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            wget \
            xz-utils \
            file \
            binutils \
            ca-certificates

      # ------------------------------------------------------------
      # ARM64 bare-metal toolchain
      #
      # KernelPatch requires:
      #
      #   aarch64-none-elf-
      #
      # This is NOT the Android kernel Clang toolchain.
      # ------------------------------------------------------------

      - name: Install ARM64 KPM toolchain
        run: |
          set -eux

          TOOLCHAIN_URL="https://developer.arm.com/-/media/Files/downloads/gnu/${TOOLCHAIN_VERSION}/binrel/arm-gnu-toolchain-${TOOLCHAIN_VERSION}-x86_64-aarch64-none-elf.tar.xz"

          ARCHIVE="$RUNNER_TEMP/aarch64-none-elf.tar.xz"
          TOOLCHAIN_DIR="$RUNNER_TEMP/aarch64-none-elf"
          TOOLCHAIN_BIN="$TOOLCHAIN_DIR/bin"

          wget \
            -q \
            "$TOOLCHAIN_URL" \
            -O "$ARCHIVE"

          rm -rf "$TOOLCHAIN_DIR"
          mkdir -p "$TOOLCHAIN_DIR"

          tar \
            -xf "$ARCHIVE" \
            -C "$TOOLCHAIN_DIR" \
            --strip-components=1

          test -x "$TOOLCHAIN_BIN/aarch64-none-elf-gcc"
          test -x "$TOOLCHAIN_BIN/aarch64-none-elf-ld"

          # Make the toolchain available to subsequent steps.
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          # Make it available immediately in this step too.
          export PATH="$TOOLCHAIN_BIN:$PATH"

          echo "Toolchain:"
          command -v aarch64-none-elf-gcc
          command -v aarch64-none-elf-ld

          aarch64-none-elf-gcc --version
          aarch64-none-elf-ld --version

      # ------------------------------------------------------------
      # KernelPatch
      # ------------------------------------------------------------

      - name: Checkout KernelPatch
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch="$KP_REF" \
            "$KP_REPO" \
            "$GITHUB_WORKSPACE/KernelPatch"

      - name: Record KernelPatch revision
        run: |
          set -eux

          echo "KernelPatch revision:"
          git -C KernelPatch rev-parse HEAD

      # ------------------------------------------------------------
      # RTL8812AU source
      # ------------------------------------------------------------

      - name: Checkout RTL8812AU
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch="$RTL_REF" \
            "$RTL_REPO" \
            "$GITHUB_WORKSPACE/rtl8812au"

      - name: Record RTL8812AU revision
        run: |
          set -eux

          echo "RTL8812AU revision:"
          git -C rtl8812au rev-parse HEAD

      # ------------------------------------------------------------
      # Apply source-level KPM port patches
      #
      # IMPORTANT:
      # These patches must contain the actual RTL8812AU -> KPM
      # port. The workflow deliberately does not fabricate or
      # silently stub driver functionality.
      # ------------------------------------------------------------

      - name: Apply RTL8812AU KPM patches
        run: |
          set -eux

          shopt -s nullglob

          patches=(patches/*.patch)

          if [ "${#patches[@]}" -eq 0 ]; then
            echo "::warning::No RTL8812AU KPM patches were found."
            echo "The KPM scaffold can still be tested, but this does"
            echo "not constitute a functional RTL8812AU driver port."
          else
            for patch in "${patches[@]}"; do
              echo
              echo "========================================"
              echo "Applying: $patch"
              echo "========================================"

              git -C rtl8812au apply \
                --verbose \
                "$GITHUB_WORKSPACE/$patch"
            done
          fi

      # ------------------------------------------------------------
      # Use KernelPatch's own KPM linker script.
      #
      # Current KernelPatch demo uses hello.lds.
      # ------------------------------------------------------------

      - name: Install KernelPatch linker script
        run: |
          set -eux

          test -f \
            KernelPatch/kpms/demo-hello/hello.lds

          mkdir -p kpm

          cp \
            KernelPatch/kpms/demo-hello/hello.lds \
            kpm/rtl8812au.lds

          echo "Linker script:"
          cat kpm/rtl8812au.lds

      # ------------------------------------------------------------
      # Verify KPM source tree
      # ------------------------------------------------------------

      - name: Verify KPM project
        run: |
          set -eux

          test -f kpm/Makefile
          test -f kpm/main.c

          echo
          echo "KPM files:"
          find kpm \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

      # ------------------------------------------------------------
      # Show complete build environment
      # ------------------------------------------------------------

      - name: Show build environment
        run: |
          set -eux

          echo "========================================"
          echo "KernelPatch"
          echo "========================================"

          git -C KernelPatch rev-parse HEAD

          echo
          echo "========================================"
          echo "RTL8812AU"
          echo "========================================"

          git -C rtl8812au rev-parse HEAD

          echo
          echo "========================================"
          echo "Compiler"
          echo "========================================"

          command -v aarch64-none-elf-gcc
          aarch64-none-elf-gcc --version

          echo
          echo "========================================"
          echo "Linker"
          echo "========================================"

          command -v aarch64-none-elf-ld
          aarch64-none-elf-ld --version

      # ------------------------------------------------------------
      # Build KPM
      #
      # TARGET_COMPILE must include the trailing '-':
      #
      #   aarch64-none-elf-
      #
      # KernelPatch's own demo uses this same model.
      # ------------------------------------------------------------

      - name: Build RTL8812AU KPM
        working-directory: kpm
        run: |
          set -eux

          make clean || true

          make \
            KP_DIR="$GITHUB_WORKSPACE/KernelPatch" \
            DRIVER_DIR="$GITHUB_WORKSPACE/rtl8812au" \
            TARGET_COMPILE="$TARGET_COMPILE"

      # ------------------------------------------------------------
      # Verify output exists
      # ------------------------------------------------------------

      - name: Verify KPM output
        run: |
          set -eux

          test -f kpm/rtl8812au.kpm

          echo
          echo "KPM file:"
          ls -lh kpm/rtl8812au.kpm

          echo
          echo "File type:"
          file kpm/rtl8812au.kpm

      # ------------------------------------------------------------
      # Inspect ELF
      # ------------------------------------------------------------

      - name: Inspect KPM ELF
        run: |
          set -eux

          echo "ELF header:"
          aarch64-none-elf-readelf \
            -h \
            kpm/rtl8812au.kpm

          echo
          echo "Sections:"
          aarch64-none-elf-readelf \
            -S \
            kpm/rtl8812au.kpm

          echo
          echo "Symbols:"
          aarch64-none-elf-readelf \
            -s \
            kpm/rtl8812au.kpm \
            || true

      # ------------------------------------------------------------
      # Optional project verification script
      # ------------------------------------------------------------

      - name: Run KPM verification script
        if: ${{ hashFiles('scripts/verify-kpm.sh') != '' }}
        run: |
          set -eux

          chmod +x scripts/verify-kpm.sh

          ./scripts/verify-kpm.sh \
            kpm/rtl8812au.kpm

      # ------------------------------------------------------------
      # SHA256
      # ------------------------------------------------------------

      - name: Generate SHA256
        run: |
          set -eux

          sha256sum \
            kpm/rtl8812au.kpm \
            > rtl8812au.kpm.sha256

          cat rtl8812au.kpm.sha256

      # ------------------------------------------------------------
      # Package source/build information
      # ------------------------------------------------------------

      - name: Generate build information
        run: |
          set -eux

          cat > rtl8812au.kpm.build-info.txt <<EOF
          KPM name: rtl8812au
          RTL8812AU revision: $(git -C rtl8812au rev-parse HEAD)
          KernelPatch revision: $(git -C KernelPatch rev-parse HEAD)
          Toolchain: ${TOOLCHAIN_VERSION}
          Target compiler: ${TARGET_COMPILE}
          Runner: ubuntu-24.04
          EOF

          cat rtl8812au.kpm.build-info.txt

      # ------------------------------------------------------------
      # Upload artifacts
      # ------------------------------------------------------------

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-kpm
          if-no-files-found: error
          path: |
            kpm/rtl8812au.kpm
            rtl8812au.kpm.sha256
            rtl8812au.kpm.build-info.txt